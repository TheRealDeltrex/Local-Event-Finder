name: Android

# Compiles the Android app on every PR. When the signing secrets are set, it
# also builds the signed release APK; pushing a tag like v1.2.0 publishes that
# APK as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (checks the code compiles)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets (normal on forks/PRs from forks); skipping release build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/LocalEventFinder-*-release.apk ../LocalEventFinder.apk

      - name: Upload APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LocalEventFinder-apk
          path: LocalEventFinder.apk

      - name: Publish release for version tags
        if: steps.signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalEventFinder.apk
          generate_release_notes: true

      - name: Remove signing files
        if: always()
        run: rm -f release.jks keystore.properties
