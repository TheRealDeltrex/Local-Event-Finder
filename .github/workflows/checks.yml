name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    name: Version and feature parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Version is in sync everywhere
        run: python scripts/version.py check
      - name: The three apps implement the same pipeline
        run: python scripts/check_parity.py
      - name: Python app imports and serves its pages
        run: |
          pip install -r requirements.txt
          python - <<'PY'
          import app
          c = app.app.test_client()
          assert c.get("/").status_code == 200
          v = c.get("/api/version").get_json()["version"]
          assert v == open("VERSION").read().strip(), v
          print("Flask app OK, version", v)
          PY
        env:
          EVENTFINDER_DATA: ${{ runner.temp }}/lef-data
      - name: Tagging tests
        run: python -m unittest discover -s tests -v
      - name: Browser version parses
        run: node --check docs/webapp.js
